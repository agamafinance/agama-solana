# Logical secret names. In simulation the CLI reads them from the environment
# (cre/.env, written by run-devnet.sh from .keys/); deployed, from the Vault DON.
secretsNames:
  # The agents' Solana signer (base58 64-byte keypair). It only pays fees and
  # signs permissionless instructions; it holds nothing else.
  AGENT_KEY:
    - CRE_AGENT_KEY
  # Chainlink Data Streams REST API credentials (testnet). Under a DON these
  # belong in the Vault DON; in simulation they come from cre/.env.
  DATASTREAMS_API_KEY:
    - CRE_DS_KEY
  DATASTREAMS_API_SECRET:
    - CRE_DS_SECRET
