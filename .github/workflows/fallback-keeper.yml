# The always-on keeper for the devnet demo. Scheduled runs on GitHub are sparse,
# so each job ticks for 5h40 (prices every 30 s when they move 0.3% or reach 7
# minutes, then the permissionless agents on every position) and a new job is
# queued every hour: one runs, the next waits its turn. Keeps the demo alive
# without any machine of ours online. Needs the KEEPER_KEY secret (the devnet
# keeper keypair as a JSON array).
name: keeper
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
concurrency:
  group: keeper
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: keeper key
        env:
          KEEPER_KEY: ${{ secrets.KEEPER_KEY }}
        run: mkdir -p .keys && printf '%s' "$KEEPER_KEY" > .keys/keeper.json
      - run: ./node_modules/.bin/tsx scripts/keeper.ts --minutes 340
        env:
          SOLANA_RPC: https://rpc.magicblock.app/devnet
