# The always-on keeper for the devnet demo. Each job ticks for 5h40 (prices
# every 30 s when they move 0.3% or reach 7 minutes, then the permissionless
# agents on every position). Its first step queues the next job, which waits its
# turn in the concurrency group and starts the moment this one ends: the chain
# does not depend on the cron, which GitHub fires late (hours) and disables
# after 60 days without activity; the hourly cron only restarts a broken chain. Keeps the demo alive
# without any machine of ours online. Needs the KEEPER_KEY secret (the devnet
# keeper keypair as a JSON array) and the Chainlink Data Streams credentials
# (DATASTREAMS_API_KEY, DATASTREAMS_API_SECRET); without them the markets are
# priced off the tokens alone.
name: keeper
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
concurrency:
  group: keeper
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fallback-keeper.yml --repo ${{ github.repository }} --ref ${{ github.ref_name }}
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: keeper key
        env:
          KEEPER_KEY: ${{ secrets.KEEPER_KEY }}
        run: mkdir -p .keys && printf '%s' "$KEEPER_KEY" > .keys/keeper.json
      - run: ./node_modules/.bin/tsx scripts/keeper.ts --minutes 340
        env:
          DATASTREAMS_API_KEY: ${{ secrets.DATASTREAMS_API_KEY }}
          DATASTREAMS_API_SECRET: ${{ secrets.DATASTREAMS_API_SECRET }}
          # In order of preference; each call fails over to the next one.
          SOLANA_RPCS: ${{ secrets.HELIUS_RPC }},https://rpc.magicblock.app/devnet,https://api.devnet.solana.com
